services:
  unbound:
    image: alpinelinux/unbound
    restart: unless-stopped

    configs:
      - source: unbound_conf
        target: /etc/unbound/unbound.conf
        uid: "100"
        gid: "101"

    networks:
      default:
        ipv4_address: 172.28.0.53

  happydeliver:
    build:
      context: .
      dockerfile: Dockerfile
    image: happydomain/happydeliver:latest
    container_name: happydeliver
    # Set a hostname
    hostname: mail.happydeliver.local

    environment:
      # Set your domain
      HAPPYDELIVER_DOMAIN: happydeliver.local
      # If port 25 is already taken on the host by your own MTA, comment out
      # the "25:25" mapping below, uncomment "10025:10025", and enable the
      # relay front-end: your MTA then relays test messages here with
      # XFORWARD, and the relay replays them to the bundled Postfix with
      # XCLIENT so the milters still see the original sender.
      # See "Running behind an MTA that already owns port 25" in the README.
      #HAPPYDELIVER_RELAY_ADDR: ":10025"
      #HAPPYDELIVER_RELAY_TRUSTED_NETS: "172.28.0.1"

    ports:
      # SMTP port
      - "25:25"
      # Relay port, when your own MTA owns port 25
      #- "10025:10025"
      # API port
      - "8080:8080"

    volumes:
      # Persistent database storage
      - ./data:/var/lib/happydeliver
      # Log files
      - ./logs:/var/log/happydeliver

    dns:
      - 172.28.0.53
    restart: unless-stopped

configs:
  unbound_conf:
    content: |
      server:
          verbosity: 1
          interface: 0.0.0.0
          port: 53
          do-ip4: yes
          do-ip6: no
          do-udp: yes
          do-tcp: yes

          access-control: 127.0.0.0/8 allow
          access-control: 172.28.0.0/24 allow

          # Short cache for a testing resolver
          cache-max-ttl: 60

          # Buffers: let the system decide
          so-sndbuf: 0
          so-rcvbuf: 0

          # Trust anchor (static, ships with the image)
          trust-anchor-file: "/etc/unbound/root.key"

volumes:
  data:
  logs:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

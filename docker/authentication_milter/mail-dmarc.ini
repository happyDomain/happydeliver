; Mail::DMARC configuration for happyDeliver.
;
; happyDeliver only *evaluates* DMARC for the messages it receives: it never
; sends nor stores aggregate/forensic reports (the DMARC handler runs with
; "no_report": 1). The report_store / smtp settings below are only present to
; keep Mail::DMARC happy, they are never used.
;
; __HOSTNAME__ and __DOMAIN__ are substituted at container start by
; docker/entrypoint.sh.

[organization]
domain             = __DOMAIN__
org_name           = happyDeliver
email              = postmaster@__DOMAIN__
extra_contact_info =

[report_store]
backend   = SQL
dsn       = dbi:SQLite:dbname=/var/lib/authentication_milter/dmarc_reports.sqlite
user      =
pass      =
auto_save = 0

[dmarc]
backend = perl

[dns]
timeout            = 5
retrans            = 5
public_suffix_list = share/public_suffix_list

[smtp]
hostname = __HOSTNAME__
